<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>iOS 风天气</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <section class="weather-card" aria-live="polite">
      <header class="card-header">
        <div>
          <p class="muted">当前位置天气</p>
          <h1 id="locationName">定位中...</h1>
        </div>
        <button id="refreshBtn" class="icon-btn" type="button" aria-label="刷新天气">↻</button>
      </header>

      <div class="current-weather">
        <div>
          <p id="weatherEmoji" class="weather-emoji">☀️</p>
          <p id="weatherText" class="weather-text">正在获取天气...</p>
        </div>
        <p><span id="currentTemp">--</span><span class="unit">°C</span></p>
      </div>

      <div class="meta-grid">
        <article class="meta-item">
          <p class="muted">体感温度</p>
          <p id="apparentTemp">--°C</p>
        </article>
        <article class="meta-item">
          <p class="muted">风速</p>
          <p id="windSpeed">-- km/h</p>
        </article>
        <article class="meta-item">
          <p class="muted">湿度</p>
          <p id="humidity">--%</p>
        </article>
        <article class="meta-item">
          <p class="muted">降水概率</p>
          <p id="rainChance">--%</p>
        </article>
      </div>

      <section>
        <h2>未来 5 天</h2>
        <ul id="forecastList" class="forecast-list"></ul>
      </section>

      <p id="status" class="status">请允许定位权限以自动获取你所在城市的天气。</p>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
