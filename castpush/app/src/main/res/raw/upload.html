<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>投屏快传 · 网页投送</title>
<style>
  :root{
    --bg:#070c16; --surface:#0f1725; --stroke:#1e2b40;
    --primary:#3d8bff; --accent:#37e0c8; --text:#f2f6ff; --muted:#8fa1bf;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(1000px 600px at 15% -10%, #16305c 0%, transparent 55%),
               radial-gradient(800px 500px at 100% 110%, #0d3f3a 0%, transparent 55%), var(--bg);
    color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    padding:24px;
  }
  .wrap{width:100%;max-width:520px}
  .brand{display:flex;align-items:center;gap:14px;margin-bottom:22px}
  .logo{
    width:52px;height:52px;border-radius:16px;display:grid;place-items:center;
    background:linear-gradient(135deg,#2e7bff,#37e0c8);box-shadow:0 10px 30px rgba(46,123,255,.35);
  }
  .logo svg{width:28px;height:28px;fill:#fff}
  .brand h1{font-size:20px;margin:0;letter-spacing:.5px}
  .brand p{margin:4px 0 0;font-size:12px;color:var(--muted)}
  .card{
    background:rgba(15,23,37,.82);border:1px solid var(--stroke);border-radius:22px;
    padding:22px;backdrop-filter:blur(12px);
  }
  .status{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-bottom:18px}
  .dot{width:7px;height:7px;border-radius:50%;background:#38d39f;box-shadow:0 0 10px #38d39f}
  .dot.off{background:#ff5c72;box-shadow:0 0 10px #ff5c72}
  .drop{
    border:1.5px dashed #2a3b57;border-radius:18px;padding:30px 18px;text-align:center;
    transition:.2s;cursor:pointer;background:rgba(10,18,31,.6);
  }
  .drop:hover,.drop.drag{border-color:var(--primary);background:rgba(61,139,255,.08)}
  .drop .apk{width:44px;height:44px;margin:0 auto 12px;border-radius:14px;background:#18253a;display:grid;place-items:center}
  .drop .apk svg{width:24px;height:24px;fill:var(--primary)}
  .drop h2{font-size:15px;margin:0 0 6px;font-weight:600}
  .drop p{font-size:12px;color:var(--muted);margin:0}
  input[type=file]{display:none}
  .file{
    display:none;align-items:center;gap:12px;background:#0b1322;border:1px solid var(--stroke);
    border-radius:16px;padding:14px;margin-top:16px;
  }
  .file .ico{width:38px;height:38px;border-radius:12px;background:#18253a;display:grid;place-items:center;flex:none}
  .file .ico svg{width:20px;height:20px;fill:var(--accent)}
  .file .name{font-size:13px;font-weight:600;word-break:break-all}
  .file .meta{font-size:11px;color:var(--muted);margin-top:3px}
  .bar{height:6px;border-radius:3px;background:#1c2a40;overflow:hidden;margin-top:18px;display:none}
  .bar i{display:block;height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,#2e7bff,#37e0c8);transition:width .15s linear}
  .progress{display:none;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:8px}
  button{
    width:100%;height:52px;margin-top:18px;border:0;border-radius:15px;cursor:pointer;
    background:linear-gradient(90deg,#2e7bff,#37e0c8);color:#fff;font-size:15px;font-weight:600;
    font-family:inherit;transition:.2s;
  }
  button:disabled{background:#22304a;color:#7d8ba3;cursor:not-allowed}
  .msg{font-size:12px;margin-top:14px;min-height:16px;text-align:center}
  .msg.ok{color:var(--accent)} .msg.err{color:#ff5c72}
  .foot{font-size:11px;color:#4e5f7a;text-align:center;margin-top:16px;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="logo">
      <svg viewBox="0 0 24 24"><path d="M1,18v3h3c0,-1.66 -1.34,-3 -3,-3zM1,14v2c2.76,0 5,2.24 5,5h2c0,-3.87 -3.13,-7 -7,-7zM1,10v2c4.97,0 9,4.03 9,9h2c0,-6.08 -4.93,-11 -11,-11zM21,3H3c-1.1,0 -2,0.9 -2,2v3h2V5h18v14h-7v2h7c1.1,0 2,-0.9 2,-2V5c0,-1.1 -0.9,-2 -2,-2z"/></svg>
    </div>
    <div>
      <h1>投屏快传</h1>
      <p>网页投送 · 局域网直达手机</p>
    </div>
  </div>

  <div class="card">
    <div class="status"><span class="dot" id="dot"></span><span id="statusText">正在连接接收端…</span></div>

    <label class="drop" id="drop">
      <div class="apk">
        <svg viewBox="0 0 24 24"><path d="M17.6,9.48l1.84,-3.18c0.16,-0.31 0.05,-0.69 -0.26,-0.85 -0.31,-0.16 -0.69,-0.05 -0.85,0.26l-1.88,3.24c-1.32,-0.59 -2.8,-0.93 -4.39,-0.93s-3.07,0.34 -4.39,0.93L5.79,5.71c-0.16,-0.31 -0.54,-0.42 -0.85,-0.26 -0.31,0.16 -0.42,0.54 -0.26,0.85l1.84,3.18C4.44,11.11 2.97,13.36 2.75,16h18.5c-0.22,-2.64 -1.69,-4.89 -3.65,-6.52zM7,14.25c-0.69,0 -1.25,-0.56 -1.25,-1.25s0.56,-1.25 1.25,-1.25 1.25,0.56 1.25,1.25 -0.56,1.25 -1.25,1.25zM17,14.25c-0.69,0 -1.25,-0.56 -1.25,-1.25s0.56,-1.25 1.25,-1.25 1.25,0.56 1.25,1.25 -0.56,1.25 -1.25,1.25z"/></svg>
      </div>
      <h2>选择或拖入 APK 文件</h2>
      <p>文件将通过投屏通道推送到这台手机</p>
      <input type="file" id="file" accept=".apk,application/vnd.android.package-archive">
    </label>

    <div class="file" id="fileBox">
      <div class="ico">
        <svg viewBox="0 0 24 24"><path d="M19,9h-4V3H9v6H5l7,7 7,-7zM5,18v2h14v-2H5z"/></svg>
      </div>
      <div style="min-width:0">
        <div class="name" id="fileName"></div>
        <div class="meta" id="fileMeta"></div>
      </div>
    </div>

    <div class="bar" id="bar"><i id="barFill"></i></div>
    <div class="progress" id="progress"><span id="pct">0%</span><span id="speed"></span></div>

    <button id="send" disabled>投屏推送</button>
    <div class="msg" id="msg"></div>
  </div>

  <div class="foot">
    仅限同一局域网使用 · 接收端需保持「投屏快传」开启<br>
    传输协议：HTTP over DLNA/SSDP 投屏通道
  </div>
</div>

<script>
(function(){
  var fileInput = document.getElementById('file');
  var drop = document.getElementById('drop');
  var fileBox = document.getElementById('fileBox');
  var fileName = document.getElementById('fileName');
  var fileMeta = document.getElementById('fileMeta');
  var sendBtn = document.getElementById('send');
  var bar = document.getElementById('bar');
  var barFill = document.getElementById('barFill');
  var progress = document.getElementById('progress');
  var pct = document.getElementById('pct');
  var speed = document.getElementById('speed');
  var msg = document.getElementById('msg');
  var dot = document.getElementById('dot');
  var statusText = document.getElementById('statusText');
  var selected = null;
  var busy = false;

  function fmt(n){
    if(n >= 1048576) return (n/1048576).toFixed(1) + ' MB';
    if(n >= 1024) return (n/1024).toFixed(0) + ' KB';
    return n + ' B';
  }

  fetch('/api/status').then(function(r){return r.json()}).then(function(s){
    dot.className = 'dot' + (s.accepting ? '' : ' off');
    statusText.textContent = '接收端：' + s.name + ' · ' + (s.accepting ? '可接收投送' : '已关闭接收');
  }).catch(function(){
    dot.className = 'dot off';
    statusText.textContent = '接收端未就绪';
  });

  function pick(f){
    if(!f) return;
    if(!/\.apk$/i.test(f.name)){
      msg.className = 'msg err'; msg.textContent = '请选择 .apk 安装包文件';
      return;
    }
    selected = f;
    fileName.textContent = f.name;
    fileMeta.textContent = fmt(f.size) + ' · 待投送';
    fileBox.style.display = 'flex';
    drop.querySelector('h2').textContent = '已选择安装包';
    drop.querySelector('p').textContent = '点击可重新选择';
    sendBtn.disabled = false;
    msg.textContent = '';
  }

  fileInput.addEventListener('change', function(){ pick(fileInput.files[0]); });
  ['dragenter','dragover'].forEach(function(ev){
    drop.addEventListener(ev, function(e){ e.preventDefault(); drop.classList.add('drag'); });
  });
  ['dragleave','drop'].forEach(function(ev){
    drop.addEventListener(ev, function(e){ e.preventDefault(); drop.classList.remove('drag'); });
  });
  drop.addEventListener('drop', function(e){
    if(e.dataTransfer.files && e.dataTransfer.files[0]) pick(e.dataTransfer.files[0]);
  });

  sendBtn.addEventListener('click', function(){
    if(!selected || busy) return;
    busy = true;
    sendBtn.disabled = true;
    msg.className = 'msg'; msg.textContent = '';
    bar.style.display = 'block';
    progress.style.display = 'flex';

    var started = Date.now();
    var xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/cast', true);
    xhr.setRequestHeader('Content-Type', 'application/vnd.android.package-archive');
    xhr.setRequestHeader('X-Cast-File-Name', encodeURIComponent(selected.name));
    xhr.setRequestHeader('X-Cast-Sender', encodeURIComponent('网页投送'));
    xhr.setRequestHeader('X-Cast-App-Label', encodeURIComponent(selected.name.replace(/\.apk$/i, '')));

    xhr.upload.onprogress = function(e){
      if(!e.lengthComputable) return;
      var p = Math.round(e.loaded / e.total * 100);
      barFill.style.width = p + '%';
      pct.textContent = p + '%';
      var sec = Math.max(1, (Date.now() - started) / 1000);
      speed.textContent = fmt(e.loaded / sec) + '/s';
    };

    xhr.onload = function(){
      busy = false;
      sendBtn.disabled = false;
      barFill.style.width = '100%';
      pct.textContent = '100%';
      var data = {};
      try { data = JSON.parse(xhr.responseText); } catch(e){}
      if(xhr.status >= 200 && xhr.status < 300 && data.ok){
        msg.className = 'msg ok';
        msg.textContent = '已推送到手机，请在接收端确认安装';
      } else {
        msg.className = 'msg err';
        msg.textContent = (data && data.error) ? data.error : ('投送失败（HTTP ' + xhr.status + '）');
      }
    };

    xhr.onerror = function(){
      busy = false;
      sendBtn.disabled = false;
      msg.className = 'msg err';
      msg.textContent = '网络异常，请检查手机与电脑是否在同一局域网';
    };

    xhr.send(selected);
  });
})();
</script>
</body>
</html>
